providers = ["python", "node"]

[phases.install]
cmds = [
	"python -m ensurepip --upgrade",
	"python -m pip install --upgrade pip",
	"python -m pip install -r requirements.txt",
	"cd frontend && npm install"
]

[phases.build]
cmds = [
	"cd frontend && npm run build"
]

[start]
cmd = "gunicorn run:app"
