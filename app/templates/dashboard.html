<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母乳喂养记录系统 - 主界面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/clock3d.css">
    <style>
        
        body {
            font-family: 'Inter', sans-serif;
            /* Use same gentle gradient as the auth page for a unified look */
            background: linear-gradient(135deg, #f0f9ff 0%, #f5e8ff 100%);
            min-height: 100vh;
        }
        
        .floating-card {
            /* Slightly smaller than full 90% so background dots are visible */
            width: 82vw;
            height: 85vh;
            max-width: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12), 0 10px 10px -5px rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            /* a bit more transparent so decorative dots can subtly show through */
            background: rgba(255, 255, 255, 0.92);
            overflow: auto;
        }
        
        .main-button {
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.12);
            width: 100%; /* make buttons fill their grid cell */
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }
        
        .main-button:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 30px -10px rgba(0, 0, 0, 0.12);
        }
        
        /* page-specific small helpers kept inline */
        /* Baby-info card refinement to match auth page light card */
        #baby-info {
            border: 1px solid rgba(15, 23, 42, 0.04);
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.9));
        }

        /* Larger screens: keep baby-info sticky in right column (so it won't overlap grid flow) */
        @media (min-width: 768px) {
            #baby-info { position: sticky; top: 1rem; }
        }
        
        /* Small-screen adjustments */
        @media (max-width: 768px) {
            .floating-card { width: 95vw; height: auto; max-height: 95vh; }
            #baby-info { position: static; width: auto; margin-bottom: 12px; }
        }
        
        /* fadeIn, float, loader and related keyframes are in shared CSS */
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    {% include '_decorative_circles.html' %}

    <!-- 主界面 -->
    <div id="main-interface" class="w-full max-w-4xl floating-card p-8 relative fade-in z-10">

    <div class="flex flex-col md:flex-row gap-6 items-stretch">
            <!-- 左侧欢迎区域：统一风格 -->
            <div class="md:w-2/5 bg-gradient-to-br from-blue-500 to-purple-600 text-white p-8 rounded-lg flex flex-col justify-between h-full">
                <h1 class="text-3xl font-bold">母乳喂养记录</h1>
                <p class="mt-3 text-blue-100">记录宝宝成长的每一个珍贵时刻</p>
                <div class="mt-6 space-y-3">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <span>记录喂养时间和时长</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <span>跟踪宝宝体重变化</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <span>生成喂养统计报告</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：按钮与统计 -->
            <div class="md:w-3/5 p-4">
                <!-- 右侧顶部宝宝信息（非绝对定位，避免遮挡按钮） -->
                <div id="baby-info" class="bg-white rounded-xl shadow-md p-4 w-full mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-lg font-semibold text-gray-800">我的宝宝</h3>
                        <button id="edit-baby-btn" class="text-blue-500 hover:text-blue-700 text-sm">编辑</button>
                    </div>
                    <div id="baby-details" class="space-y-2">
                        <div class="flex justify-between">
                            <span class="text-gray-600">姓名:</span>
                            <span id="baby-name" class="font-medium">未设置</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">性别:</span>
                            <span id="baby-gender" class="font-medium">未知</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">出生日期:</span>
                            <span id="baby-birthdate" class="font-medium">未设置</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">月龄:</span>
                            <span id="baby-age" class="font-medium">-</span>
                        </div>
                    </div>
                </div>
                <!-- 四个主按钮：使用响应式网格，水平均匀分布 -->
                <div class="w-full">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div>
                    <button id="direct-button" aria-label="亲喂" class="main-button bg-green-500 hover:bg-green-600 text-white font-semibold rounded-2xl text-lg flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                        亲喂
                    </button>
                </div>

                <div>
                    <button id="sleep-button" aria-label="睡眠" class="main-button bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-2xl text-lg flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />

                <div>

                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        瓶喂
                    </button>
                </div>

                <div>
                    <button id="record-button" aria-label="记录" class="main-button bg-purple-500 hover:bg-purple-600 text-white font-semibold rounded-2xl text-lg flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        记录
                    </button>
                </div>
                    </div> <!-- .grid -->
                    
                </div> <!-- .w-full (buttons) -->

                <!-- 底部统计信息 (仍在右侧列) -->
                <div class="mt-8 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white rounded-xl p-4 shadow text-center">
                        <p class="text-gray-600">今日亲喂次数</p>
                        <p id="today-feed-count" class="text-2xl font-bold text-green-500">3</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow text-center">
                        <p class="text-gray-600">今日睡眠时长</p>
                        <p id="today-sleep-duration" class="text-2xl font-bold text-yellow-500">5.2h</p>

                        <p class="text-gray-600">今日瓶喂 (ml)</p>
                        <p id="today-bottle-ml" class="text-xl font-bold text-blue-500">0</p>
                    </div>
                </div>
                <!-- 周统计图表已移至下方以占据整个卡片宽度 -->
            </div> <!-- .md:w-3/5 (right column) -->
        </div> <!-- .flex (main split) -->

        <!-- 将周统计图表移出右侧列，使其占据整个浮动卡片宽度 -->

            <canvas id="weekly-chart" style="width:100%;height:260px;display:block;"></canvas>
        </div>

        <div id="today-timeline-card" class="mt-6 bg-white rounded-xl p-4 shadow w-full">

                <!-- timeline items will be injected here -->
            </div>
        </div>
    </div> <!-- #main-interface -->

    <!-- 全局页面内通知（支持多条、队列、自动消失与手动关闭） -->
    <div id="global-notification" class="fixed top-6 right-6 z-50" style="pointer-events: none;"></div>
    <script src="/static/js/notifications.js"></script>

    <!-- 3D Timer Modal -->
    <div id="timer3d-modal" class="hidden" aria-hidden="true">
        <div id="timer3d-backdrop" class="timer3d-modal-backdrop"></div>
        <div class="timer3d-wrap">
            <div class="timer3d-card">
                <button id="timer3d-stop" class="timer3d-stop-btn">停止</button>
                <div id="timer3d-display"></div>
            </div>
        </div>
    </div>

    <!-- 创建婴儿模态（覆盖层） -->
    <div id="create-baby-modal" class="hidden">
        <div id="create-baby-backdrop" class="modal-backdrop"></div>
        <div class="fixed inset-0 z-40 flex items-center justify-center p-4">
            <div role="dialog" aria-modal="true" aria-labelledby="create-baby-title" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6">
                <div class="text-center mb-4">
                    <h2 id="create-baby-title" class="text-2xl font-bold text-gray-800">添加宝宝信息</h2>
                    <p class="text-gray-600 mt-2">请填写宝宝的基本信息</p>
                </div>

                <form id="create-baby-form" class="space-y-4">
                    <div>
                        <label for="baby-name-input" class="block text-sm font-medium text-gray-700 mb-1">宝宝姓名</label>
                        <input type="text" id="baby-name-input" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入宝宝姓名" required>
                    </div>
                    
                    <div>
                        <label for="baby-gender-select" class="block text-sm font-medium text-gray-700 mb-1">宝宝性别</label>
                        <select id="baby-gender-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">请选择性别</option>
                            <option value="boy">男宝宝</option>
                            <option value="girl">女宝宝</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="baby-birthdate-data" class="block text-sm font-medium text-gray-700 mb-1">出生日期</label>
                        <input type="date" id="baby-birthdate-data" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    
                    <div>
                        <label for="baby-weight" class="block text-sm font-medium text-gray-700 mb-1">出生体重 (kg)</label>
                        <input type="number" step="0.01" id="baby-weight" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例如: 3.2">
                    </div>
                    
                    <div class="flex space-x-4 pt-4">

                        <button type="submit" id="save-baby-btn" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200 flex items-center justify-center">
                            <span id="save-baby-text">保存</span>
                            <span id="save-baby-loader" class="loader hidden" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div id="create-baby-message" role="status" aria-live="polite" class="text-sm text-center mt-2 hidden"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- 瓶喂记录模态 -->
    <div id="bottle-feed-modal" class="hidden">
        <div id="bottle-feed-backdrop" class="modal-backdrop"></div>
        <div class="fixed inset-0 z-40 flex items-center justify-center p-4">
            <div role="dialog" aria-modal="true" aria-labelledby="bottle-feed-title" class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-6">
                <div class="text-center mb-4">
                    <h2 id="bottle-feed-title" class="text-2xl font-bold text-gray-800">记录瓶喂</h2>
                    <p class="text-gray-600 mt-2">选择母乳或配方，并填写毫升与备注</p>
                </div>

                <form id="bottle-feed-form" class="space-y-4">
                    <div>
                        <fieldset>
                            <legend class="text-sm font-medium text-gray-700 mb-2">类型</legend>
                            <label class="inline-flex items-center mr-4">
                                <input type="radio" name="bottle-type" value="breast" checked class="form-radio h-4 w-4 text-blue-600">
                                <span class="ml-2">母乳</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="bottle-type" value="formula" class="form-radio h-4 w-4 text-blue-600">
                                <span class="ml-2">配方奶</span>
                            </label>
                            <label class="inline-flex items-center ml-4">
                                <input type="radio" name="bottle-type" value="pump" class="form-radio h-4 w-4 text-blue-600">

                    </div>

                    <div>

                    <div>

    <!-- 大小便记录模态 -->
    <div id="diaper-modal" class="hidden">
        <div id="diaper-backdrop" class="modal-backdrop"></div>
        <div class="fixed inset-0 z-40 flex items-center justify-center p-4">
            <div role="dialog" aria-modal="true" aria-labelledby="diaper-title" class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-6">
                <div class="text-center mb-4">
                    <h2 id="diaper-title" class="text-2xl font-bold text-gray-800">记录大小便</h2>
                    <p class="text-gray-600 mt-2">请选择类型并填写备注（可选）</p>
                </div>

                <form id="diaper-form" class="space-y-4">
                    <div>
                        <fieldset>
                            <legend class="text-sm font-medium text-gray-700 mb-2">类型</legend>
                            <label class="inline-flex items-center mr-4">
                                <input type="radio" name="diaper-type" value="wet" checked class="form-radio h-4 w-4 text-green-600">
                                <span class="ml-2">小号</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="diaper-type" value="dirty" class="form-radio h-4 w-4 text-red-600">
                                <span class="ml-2">大号</span>
                            </label>
                        </fieldset>
                    </div>

                    <div>
                        <label for="diaper-notes" class="block text-sm font-medium text-gray-700 mb-1">备注 (可选)</label>
                        <input type="text" id="diaper-notes" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="例如：有血丝或颜色异常" />
                    </div>

                    <div class="flex space-x-4 pt-4">
                        <button type="button" id="cancel-diaper" class="flex-1 bg-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-400 transition duration-200">取消</button>
                        <button type="submit" id="save-diaper-btn" class="flex-1 bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 transition duration-200">保存</button>
                    </div>
                    <div id="diaper-feed-message" role="status" aria-live="polite" class="text-sm text-center mt-2 hidden"></div>
                </form>
            </div>
        </div>
    </div>

    

    <script>
    // 模拟从后端获取用户婴儿信息
    // 配置后端API地址：使用 window.location.origin 保证从局域网设备访问时指向当前主机
    const API_BASE_URL = window.location.origin + '/api';
        async function getUserBabyInfo() {
            console.log("开始获取用户婴儿信息...");

            // 从本地存储获取token
            const token = localStorage.getItem('authToken');
            if (!token) {
                console.warn("未找到认证token");
                return {
                    hasBaby: false,
                    baby: null
                };
            }

            
            try {
                console.log("Bearer xxxxx");
                console.log(`Bearer ${token}`);
                console.log("发送获取婴儿信息请求...");
                
                const response = await fetch('/api/baby/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`  // 根据您的后端认证方式调整
                    }
                });

                console.log("收到婴儿信息响应，状态码:", response.status);
                if (response.ok) {
                    const data = await response.json();
                    console.log("婴儿信息响应数据:", data);

                    if (data.data.length > 0) {
                        console.log("返回第一个婴儿数据:", data.data[0]);
                        return {
                            hasBaby: true,
                            baby: data.data[0] // 假设只取第一个婴儿的信息
                        };
                    } else {
                        return {
                            hasBaby: false,
                            baby: null
                        };
                    }
                } else if (response.status === 401) {
                    console.warn("认证失败，可能需要重新登录");
                    return {
                        hasBaby: false,
                        baby: null
                    };
                } else {
                    console.error("获取婴儿信息失败，服务器返回错误:", response.status);
                    return {
                        hasBaby: false,
                        baby: null
                    };
                }
            } catch (error) {
                console.error("获取婴儿信息时发生错误:", error);
                return {
                    hasBaby: false,
                    baby: null
                };
            }
        }

        // 页面加载时检查用户是否有婴儿
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const babyInfo = await getUserBabyInfo();
                if (babyInfo.hasBaby && babyInfo.baby) {
                // if (babyInfo.hasBaby && babyInfo.baby) {
                    // 用户有婴儿，显示主界面并更新婴儿信息
                    showMainInterface();
                    updateBabyInfo(babyInfo.baby);
                } else {

                if (!modal.classList.contains('hidden')) {
                    hideCreateBabyModal();
                }
            }

            // Focus trap: if modal open, trap tab within modal dialog
            if (!modal.classList.contains('hidden') && e.key === 'Tab') {
                const focusable = modal.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.shiftKey) { // shift + tab
                    if (document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    }
                } else { // tab
                    if (document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }
        });

        function msToHMS(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2,'0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,'0');
            const secs = String(totalSeconds % 60).padStart(2,'0');
            return `${hrs}:${mins}:${secs}`;
        }

        // 从后端获取用户信息并存储用户ID
        async function fetchUserInfo() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                console.warn("未找到认证token，无法获取用户信息");
                return;
            }

            try {
                const response = await fetch('/api/user/info', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("用户信息:", data);

                    // 存储用户ID以备后用
                    localStorage.setItem('currentUserId', data.user.id); // 假设后端返回了用户 ID
                } else {
                    console.error("获取用户信息失败，状态码:", response.status);
                }
            } catch (error) {
                console.error("获取用户信息时发生错误:", error);
            }
        }

        // 今日时间线渲染与加载（可被 refreshUI 与其他操作调用）
        async function fetchAndRenderTimeline(babyId){
            if (!babyId) return;
            const token = localStorage.getItem('authToken');
            if (!token) return;

            const startOfDay = new Date();
            startOfDay.setHours(0,0,0,0);
            const startIso = startOfDay.toISOString();
            const endIso = new Date().toISOString();

            try {
                // Parallel fetch event lists
                const [feedRes, directRes, sleepRes, bottleRes, formulaRes, pumpRes, diaperRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/feeding/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/feeding/direct/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/sleep/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/feeding/breast-bottle/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/feeding/formula/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/feeding/pumps/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}}),
                    fetch(`${API_BASE_URL}/diaper/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {headers: {'Authorization': `Bearer ${token}`}})
                ]);

                const results = await Promise.all([feedRes.json().catch(()=>({})), directRes.json().catch(()=>({})), sleepRes.json().catch(()=>({})), bottleRes.json().catch(()=>({})), formulaRes.json().catch(()=>({})), pumpRes.json().catch(()=>({})), diaperRes.json().catch(()=>({}))]);

                const [feedJ, directJ, sleepJ, bottleJ, formulaJ, pumpJ, diaperJ] = results;

                const items = [];

                // feedings (includes bottle & breast generic records) - use start_time / bottle_ml
                if (feedJ && feedJ.data && Array.isArray(feedJ.data)){
                    for (const f of feedJ.data){
                        items.push({
                            type: f.feeding_type === 'breast' ? 'breast_generic' : 'formula',
                            title: f.feeding_type === 'breast' ? '母乳（一般）' : '配方奶（瓶喂）',
                            start: f.start_time || f.timestamp || f.created_at,
                            end: f.end_time || null,
                            ml: f.bottle_ml || f.breast_ml || 0,
                            notes: f.notes || ''
                        });
                    }
                }

                // bottle breast (detailed)
                if (bottleJ && bottleJ.data && Array.isArray(bottleJ.data)){
                    for (const b of bottleJ.data){
                        items.push({ type: 'bottle_breast', title: '瓶喂（母乳）', start: b.timestamp||b.created_at, ml: b.volume_ml, notes: b.notes||'' });
                    }
                }
                // formula
                if (formulaJ && formulaJ.data && Array.isArray(formulaJ.data)){
                    for (const fb of formulaJ.data){
                        items.push({ type: 'formula', title: '瓶喂（配方）', start: fb.timestamp||fb.created_at, ml: fb.volume_ml, notes: fb.notes||'' });
                    }
                }

                // pumps
                if (pumpJ && pumpJ.data && Array.isArray(pumpJ.data)){
                    for (const p of pumpJ.data){
                        items.push({ type: 'pump', title: '泵奶', start: p.start_time||p.created_at, end: p.end_time||null, ml: p.volume_ml, notes: p.notes||'' });
                    }
                }

                // direct breast
                if (directJ && directJ.data && Array.isArray(directJ.data)){
                    for (const d of directJ.data){
                        items.push({ type: 'direct', title: '亲喂', start: d.start_time, end: d.end_time||null, notes: d.notes||'' });
                    }
                }

                // sleep
                if (sleepJ && sleepJ.data && Array.isArray(sleepJ.data)){
                    for (const s of sleepJ.data){
                        items.push({ type: 'sleep', title: '睡眠', start: s.start_time, end: s.end_time||null, notes: s.notes||'' });
                    }
                }

                // diapers
                if (diaperJ && diaperJ.data && Array.isArray(diaperJ.data)){
                    for (const dp of diaperJ.data){
                        items.push({ type: dp.diaper_type === 'dirty' ? 'dirty' : 'wet', title: dp.diaper_type === 'dirty' ? '大便' : '小便', start: dp.timestamp, notes: dp.notes||'' });
                    }
                }

                // sort by time (use start; fallback created_at). Convert ISO to timestamp
                items.sort((a,b)=>{ const ta = a.start? Date.parse(a.start):0; const tb = b.start? Date.parse(b.start):0; return ta - tb; });

                renderTimelineItems(items);

            } catch (e){
                console.error('fetchAndRenderTimeline error', e);
            }
        }

        function renderTimelineItems(items){
            const container = document.getElementById('today-timeline');
            if (!container) return;
            if (!items || items.length===0){ container.innerHTML = '<p class="text-sm text-gray-500">今天还没有记录</p>'; return; }

            // Build timeline HTML
            let html = '<div class="relative pl-12">';
            // vertical line
            html += '<div class="absolute left-5 top-0 bottom-0 w-0.5 bg-gray-200"></div>';

            for (const it of items){
                const color = (it.type==='direct')? 'bg-green-500' : (it.type==='sleep')? 'bg-yellow-400' : (it.type==='pump')? 'bg-purple-500' : (it.type==='bottle_breast')? 'bg-teal-400' : (it.type==='formula')? 'bg-blue-500' : (it.type==='dirty')? 'bg-red-500' : 'bg-indigo-400';
                const timeText = it.end ? `${formatTime(it.start)} - ${formatTime(it.end)}` : formatTime(it.start);
                const mlText = (it.ml && it.ml>0) ? `<div class="text-sm text-gray-700 font-medium">${it.ml} ml</div>` : '';
                const notes = it.notes ? `<div class="text-sm text-gray-600 mt-1">${escapeHtml(it.notes)}</div>` : '';

                html += `
                    <div class="mb-4 flex items-start">
                        <div class="w-10 flex flex-col items-center">
                            <div class="w-3 h-3 rounded-full ${color} mt-1"></div>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="bg-white border-l-4 ${color} p-3 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div class="text-sm font-semibold text-gray-800">${escapeHtml(it.title)}</div>
                                    <div class="text-xs text-gray-500">${escapeHtml(timeText)}</div>
                                </div>
                                ${mlText}
                                ${notes}
                            </div>
                        </div>
                    </div>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function formatTime(iso){
            if (!iso) return '';
            try{ const d = new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } catch(e){ return iso; }
        }

        function escapeHtml(s){ if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        // 刷新统计：剩余母乳量 & 今日喂养次数
        async function fetchAndUpdateStats(babyId) {
            if (!babyId) return;
            const token = localStorage.getItem('authToken');
            try {
                // 获取剩余母乳量
                const remRes = await fetch(`/api/feeding/breast/remaining/${babyId}`, {
                    method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                if (remRes.ok) {
                    const remData = await remRes.json();
                    const remaining = remData.data && remData.data.remaining_ml != null ? remData.data.remaining_ml : 0;
                    // update remaining milk display
                    const remainingEl = document.getElementById('remaining-milk-ml');
                    if (remainingEl) {
                        remainingEl.textContent = remaining;
                    }
                    // remaining milk already updated above
                }

                // 计算今日喂养次数（使用新接口获取汇总）
                const startOfDay = new Date();
                startOfDay.setHours(0,0,0,0);
                const startIso = startOfDay.toISOString();
                const endIso = new Date().toISOString();
                const countRes = await fetch(`/api/feeding/count?baby_id=${babyId}&start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {
                    method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                if (countRes.ok) {
                    const countData = await countRes.json();
                    const total = (countData.data && typeof countData.data.total === 'number') ? countData.data.total : 0;
                    document.getElementById('today-feed-count').textContent = total;
                }

                // 获取今日瓶喂总毫升数（母乳瓶喂 + 配方奶）
                const bottleRes = await fetch(`/api/feeding/bottle-ml?baby_id=${babyId}&start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {
                    method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                if (bottleRes.ok) {
                    const bottleData = await bottleRes.json();
                    const ml = (bottleData.data && typeof bottleData.data.total_ml === 'number') ? bottleData.data.total_ml : 0;
                    const bottleEl = document.getElementById('today-bottle-ml');
                    if (bottleEl) bottleEl.textContent = ml;
                }

                // 计算今日睡眠总时长（从睡眠接口获取记录并累加 duration_minutes 字段或计算差值）
                const sleepRes = await fetch(`/api/sleep/${babyId}?start_date=${encodeURIComponent(startIso)}&end_date=${encodeURIComponent(endIso)}`, {
                    method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                if (sleepRes.ok) {
                    const sleepData = await sleepRes.json();
                    const sleeps = (sleepData.data && Array.isArray(sleepData.data)) ? sleepData.data : [];
                    let totalMinutes = 0;
                    for (const s of sleeps) {
                        // 优先使用后端计算的 duration_minutes（如果存在），否则用 start/end 计算
                        if (s.duration_minutes != null) {
                            totalMinutes += Number(s.duration_minutes) || 0;
                        } else if (s.start_time && s.end_time) {
                            const st = new Date(s.start_time);
                            const en = new Date(s.end_time);
                            const mins = Math.max(0, (en - st) / 60000);
                            totalMinutes += mins;
                        }
                    }
                    // 显示为小时（保留一位小数）
                    const hours = (totalMinutes / 60).toFixed(1);
                    document.getElementById('today-sleep-duration').textContent = `${hours}h`;
                }
            } catch (e) {
                console.error('fetchAndUpdateStats error', e);
            }

                // 同步加载周统计图（默认：过去7天，不含今天）
                try { await fetchAndRenderWeeklyChart(babyId); } catch(e){ console.error('weekly chart load failed', e); }
        }

        // 统一刷新界面（统计 + 周视图 + 今日时间线）
        async function refreshUI(babyId){
            if (!babyId) return;
            try {
                // Update stats and weekly chart first, then timeline.
                await fetchAndUpdateStats(babyId);
            } catch (e) {
                console.error('refreshUI stats error', e);
            }
            try {
                await fetchAndRenderTimeline(babyId);
            } catch (e) {
                console.error('refreshUI timeline error', e);
            }
        }

            // 获取并渲染周统计（不包含今天）
            let weeklyChart = null;

            // 检查并恢复活动计时器（如果存在）
            async function fetchAndResumeActiveTimers(babyId){
                if (!babyId) return;
                const token = localStorage.getItem('authToken');
                if (!token) return;

                try {
                    // First, check localStorage fallback in case browser was closed before server-side record could be fetched
                    try {
                        const stored = localStorage.getItem(`active_direct_${babyId}`);
                        if (stored) {
                            const obj = JSON.parse(stored);
                            if (obj && obj.start_time) {
                                currentDirectId = obj.id || null;
                                currentTimerMode = 'direct';
                                openTimer3D(obj.start_time);
                                return;
                            }
                        }
                    } catch (e) { /* ignore parse errors */ }

                    // Check active direct breastfeeding
                    const resDirect = await fetch(`${API_BASE_URL}/feeding/direct/active?baby_id=${babyId}`, {
                        method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                    });
                    if (resDirect && resDirect.ok){
                        const j = await resDirect.json();
                        if (j.data){
                            const rec = j.data;
                            currentDirectId = rec.id;
                            currentTimerMode = 'direct';
                            const serverStartIso = rec.start_time || rec.created_at || new Date().toISOString();
                            openTimer3D(serverStartIso);
                            return; // prefer direct if active
                        }
                    }

                    // Check active sleep
                    const resSleep = await fetch(`${API_BASE_URL}/sleep/active?baby_id=${babyId}`, {
                        method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                    });
                    if (resSleep && resSleep.ok){
                        const j2 = await resSleep.json();
                        if (j2.data){
                            const rec = j2.data;
                            currentSleepId = rec.id;
                            currentTimerMode = 'sleep';
                            const serverStartIso = rec.start_time || rec.created_at || new Date().toISOString();
                            try { localStorage.setItem(`active_sleep_${babyId}`, JSON.stringify({ id: currentSleepId, start_time: serverStartIso })); } catch (e) {}
                            openTimer3D(serverStartIso);
                        }
                    }
                    // If server didn't return an active sleep, check localStorage fallback
                    try {
                        const storedS = localStorage.getItem(`active_sleep_${babyId}`);
                        if (storedS && !currentSleepId) {
                            const objS = JSON.parse(storedS);
                            if (objS && objS.start_time) {
                                currentSleepId = objS.id || null;
                                currentTimerMode = 'sleep';
                                openTimer3D(objS.start_time);
                            }
                        }
                    } catch (e) { /* ignore */ }
                } catch (e) {
                    console.error('fetchAndResumeActiveTimers error', e);
                }
            }
            async function fetchAndRenderWeeklyChart(babyId){
                if (!babyId) return;
                const token = localStorage.getItem('authToken');

                // compute start = 7 days ago (00:00), end = yesterday 23:59:59
                const today = new Date();
                const end = new Date(today);
                end.setHours(0,0,0,0); // today 00:00
                end.setMilliseconds(-1); // yesterday 23:59:59.999
                const start = new Date(end);
                start.setDate(start.getDate() - 6); // inclusive 7 days
                start.setHours(0,0,0,0);

                const payload = {
                    baby_id: babyId,
                    start_date: start.toISOString(),
                    end_date: end.toISOString()
                };

                const res = await fetch('/api/stats/weekly/overview', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) return;
                const j = await res.json();
                const d = j.data || {};
                const labels = ['1','2','3','4','5','6','7'];

                const datasets = [
                    {
                        label: '亲喂次数',
                        data: d.direct_counts || [],
                        backgroundColor: 'rgba(34,197,94,0.9)',
                        yAxisID: 'yLeft'
                    },
                    {
                        label: '大便次数',
                        data: d.dirty_counts || [],
                        backgroundColor: 'rgba(239,68,68,0.9)',
                        yAxisID: 'yLeft'
                    },
                    {
                        label: '小便次数',
                        data: d.wet_counts || [],
                        backgroundColor: 'rgba(59,130,246,0.9)',
                        yAxisID: 'yLeft'
                    },
                    {
                        label: '睡眠分钟',
                        data: d.sleep_minutes || [],
                        backgroundColor: 'rgba(168,85,247,0.9)',
                        yAxisID: 'yRight'
                    },
                    {
                        label: '瓶喂(ml)',
                        data: d.bottle_ml || [],
                        backgroundColor: 'rgba(14,165,233,0.9)',
                        yAxisID: 'yRight'
                    }
                ];

                const ctx = document.getElementById('weekly-chart').getContext('2d');
                if (weeklyChart) { weeklyChart.data.labels = labels; weeklyChart.data.datasets = datasets; weeklyChart.update(); return; }

                weeklyChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            yLeft: {
                                type: 'linear',
                                position: 'left',
                                title: { display: true, text: '次数' },
                                beginAtZero: true
                            },
                            yRight: {
                                type: 'linear',
                                position: 'right',
                                title: { display: true, text: '分钟 / ml' },
                                beginAtZero: true,
                                grid: { drawOnChartArea: false }
                            }
                        },
                        plugins: {
                            legend: { position: 'top' }
                        }
                    }
                });
            }

        

        // 页面加载时获取用户信息
        //暂时，决定，在login时存储userid
