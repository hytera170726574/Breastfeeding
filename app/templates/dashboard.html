<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母乳喂养记录系统 - 主界面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/clock3d.css">
    <style>
        
        body {
            font-family: 'Inter', sans-serif;
            /* Use same gentle gradient as the auth page for a unified look */
            background: linear-gradient(135deg, #f0f9ff 0%, #f5e8ff 100%);
            min-height: 100vh;
        }
        
        .floating-card {
            /* Slightly smaller than full 90% so background dots are visible */
            width: 82vw;
            height: 85vh;
            max-width: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12), 0 10px 10px -5px rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            /* a bit more transparent so decorative dots can subtly show through */
            background: rgba(255, 255, 255, 0.92);
            overflow: auto;
        }
        
        .main-button {
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.12);
            width: 100%; /* make buttons fill their grid cell */
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }
        
        .main-button:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 30px -10px rgba(0, 0, 0, 0.12);
        }
        
        /* page-specific small helpers kept inline */
        /* Baby-info card refinement to match auth page light card */
        #baby-info {
            border: 1px solid rgba(15, 23, 42, 0.04);
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.9));
        }

        /* Larger screens: keep baby-info sticky in right column (so it won't overlap grid flow) */
        @media (min-width: 768px) {
            #baby-info { position: sticky; top: 1rem; }
        }
        
        /* Small-screen adjustments */
        @media (max-width: 768px) {
            .floating-card { width: 95vw; height: auto; max-height: 95vh; }
            #baby-info { position: static; width: auto; margin-bottom: 12px; }
        }
        
        /* fadeIn, float, loader and related keyframes are in shared CSS */
    </style>
</head>

    <script>
        // 模拟从后端获取用户婴儿信息
        // 配置后端API地址
        const API_BASE_URL = 'http://127.0.0.1:5000/api';
        async function getUserBabyInfo() {
            console.log("开始获取用户婴儿信息...");

            // 从本地存储获取token
            const token = localStorage.getItem('authToken');
            if (!token) {
                console.warn("未找到认证token");
                return {
                    hasBaby: false,
                    baby: null
                };
            }

            try {
                console.log("Bearer xxxxx");
                console.log(`Bearer ${token}`);
                console.log("发送获取婴儿信息请求...");
                
                const response = await fetch('/api/baby/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`  // 根据您的后端认证方式调整
                    }
                });

                console.log("收到婴儿信息响应，状态码:", response.status);
                if (response.ok) {
                    const data = await response.json();
                    console.log("婴儿信息响应数据:", data);

                    if (data.data.length > 0) {
                        console.log("返回第一个婴儿数据:", data.data[0]);
                        return {
                            hasBaby: true,
                            baby: data.data[0] // 假设只取第一个婴儿的信息
                        };
                    } else {
                        return {
                            hasBaby: false,
                            baby: null
                        };
                    }
                } else if (response.status === 401) {
                    console.warn("认证失败，可能需要重新登录");
                    return {
                        hasBaby: false,
                        baby: null
                    };
                } else {
                    console.error("获取婴儿信息失败，服务器返回错误:", response.status);
                    return {
                        hasBaby: false,
                        baby: null
                    };
                }
            } catch (error) {
                console.error("获取婴儿信息时发生错误:", error);
                return {
                    hasBaby: false,
                    baby: null
                };
            }
        }

        // 页面加载时检查用户是否有婴儿
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const babyInfo = await getUserBabyInfo();
                if (babyInfo.hasBaby && babyInfo.baby) {
                // if (babyInfo.hasBaby && babyInfo.baby) {
                    // 用户有婴儿，显示主界面并更新婴儿信息
                    showMainInterface();
                    updateBabyInfo(babyInfo.baby);
                } else {
                    // 用户没有婴儿，显示创建婴儿界面
                    showCreateBabyModal();
                }
            } catch (error) {
                console.error('获取婴儿信息失败:', error);
                // 默认显示创建婴儿界面
                showCreateBabyModal();
            }
        });

        // 显示主界面（主界面仍然保持可见，当 modal 关闭时用户返回主界面）
        function showMainInterface() {
            document.getElementById('main-interface').classList.remove('hidden');
        }

        // 显示/隐藏创建婴儿模态
        function showCreateBabyModal() {
            document.getElementById('create-baby-modal').classList.remove('hidden');
            // focus first input for accessibility
            const nameInput = document.getElementById('baby-name-input');
            if (nameInput) setTimeout(() => nameInput.focus(), 50);
        }

        function hideCreateBabyModal() {
            document.getElementById('create-baby-modal').classList.add('hidden');
        }

        // Close modal on ESC and implement focus trap when modal open
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('create-baby-modal');
            if (!modal) return;

            // Escape closes modal
            if (e.key === 'Escape') {
                if (!modal.classList.contains('hidden')) {
                    hideCreateBabyModal();
                }
            }

            // Focus trap: if modal open, trap tab within modal dialog
            if (!modal.classList.contains('hidden') && e.key === 'Tab') {
                const focusable = modal.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.shiftKey) { // shift + tab
                    if (document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    }
                } else { // tab
                    if (document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }
        });

        // Click on backdrop closes modal
        document.addEventListener('click', function(e) {
            const backdrop = document.getElementById('create-baby-backdrop');
            if (backdrop && e.target === backdrop) {
                hideCreateBabyModal();
            }
        });

        // 3D Timer modal helpers
        let timer3dInstance = null;
        function openTimer3D(serverStartIso){
            const modal = document.getElementById('timer3d-modal');
            const display = document.getElementById('timer3d-display');
            if (!modal || !display) return;
            modal.classList.remove('hidden');
            if (timer3dInstance) { timer3dInstance.stop(); timer3dInstance = null; }
            timer3dInstance = new Timer3D(display);
            timer3dInstance.start(serverStartIso);
        }
        function closeTimer3D(){
            const modal = document.getElementById('timer3d-modal');
            if (timer3dInstance){ timer3dInstance.stop(); timer3dInstance = null; }
            if (modal) modal.classList.add('hidden');
        }

        // 当前选择的婴儿 ID（用于记录请求）
    let currentBabyId = localStorage.getItem('currentBabyId') ? parseInt(localStorage.getItem('currentBabyId')) : null;
        // 当前正在进行的睡眠记录 ID
        let currentSleepId = null;
    // 已移除计时器 interval 相关逻辑

        // 更新婴儿信息
        function updateBabyInfo(baby) {
            document.getElementById('baby-name').textContent = baby.name || '未设置';
            document.getElementById('baby-gender').textContent = baby.gender === 'male' ? '男' : baby.gender === 'female' ? '女' : '未知';
            document.getElementById('baby-birthdate').textContent = baby.birth_date || '未设置';
            // 保存当前婴儿 ID
            if (baby.id) {
                currentBabyId = baby.id;
                localStorage.setItem('currentBabyId', baby.id);
            }
            
            // 计算月龄
            if (baby.birth_date) {
                const birthDate = new Date(baby.birth_date);
                const today = new Date();
                const months = (today.getFullYear() - birthDate.getFullYear()) * 12 + 
                              (today.getMonth() - birthDate.getMonth());
                console.log("计算出的月龄:", months);
                document.getElementById('baby-age').textContent = `${months}个月`;
            } else {
                document.getElementById('baby-age').textContent = '-';
            }
        }

        // 创建婴儿表单提交
        document.getElementById('create-baby-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 获取表单字段的值
            const name = document.getElementById('baby-name-input').value.trim();
            // document.getElementById('baby-gender-select').addEventListener('change', function() {
            //     console.log(this.value); // 当前选中的值
            // });
            const gender_tmp = document.getElementById('baby-gender-select').value.trim();
            var gender;
            if (gender_tmp == "boy" )
            {
                gender = "male";
            } else{
                gender = "female";
            }
            // var gender;
            // document.getElementById('baby-gender').addEventListener('change', function() {
            //     gender = this.value;   
            // });
            const birth_date = document.getElementById('baby-birthdate-data').value.trim();

            // 检查是否正确获取数据
            console.log("表单数据:", { name, gender, birth_date });

            // 验证数据是否完整
            if (!name) {
                alert('请填写宝宝姓名');
                return;
            }

            if (!gender) {
                alert('请选择宝宝性别');
                return;
            }

            if (!birth_date) {
                alert('请选择宝宝出生日期');
                return;
            }

            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('未找到认证信息，请重新登录');
                return;
            }
            var user_id = 0;//服务器后端会更新ID为当前登录用户的uerid
            
            // 定义当前时间字符串
            const currentTime = new Date().toISOString();
            console.log("当前时间:", currentTime);
            var created_at="2000-01-01";
            var id=0;
            const formData = {
                name,
                gender,
                birth_date
            };
            console.log("发送的创建婴儿数据:", JSON.stringify(formData));
            // UX: 显示 loader 并禁用按钮
            const saveBtn = document.getElementById('save-baby-btn');
            const saveText = document.getElementById('save-baby-text');
            const saveLoader = document.getElementById('save-baby-loader');
            const msgEl = document.getElementById('create-baby-message');
            if (msgEl) { msgEl.classList.add('hidden'); msgEl.textContent = ''; }
            if (saveBtn) saveBtn.disabled = true;
            if (saveLoader) saveLoader.classList.remove('hidden');
            if (saveText) saveText.textContent = '保存中...';

            try {
                const response = await fetch('/api/baby/createBaby', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('创建婴儿成功:', data);

                    // 更新婴儿信息并显示成功消息
                    updateBabyInfo(data);
                    if (msgEl) { msgEl.textContent = '宝宝信息创建成功！'; msgEl.classList.remove('hidden'); msgEl.classList.remove('text-red-500'); msgEl.classList.add('text-green-500'); }

                    // 关闭模态并重置按钮（稍作延迟以便用户看到消息）
                    setTimeout(() => {
                        hideCreateBabyModal();
                        if (saveBtn) saveBtn.disabled = false;
                        if (saveLoader) saveLoader.classList.add('hidden');
                        if (saveText) saveText.textContent = '保存';
                    }, 900);
                } else {
                    console.error('创建婴儿失败，状态码:', response.status);
                    if (msgEl) { msgEl.textContent = '创建失败，请稍后重试'; msgEl.classList.remove('hidden'); msgEl.classList.remove('text-green-500'); msgEl.classList.add('text-red-500'); }
                    if (saveBtn) saveBtn.disabled = false;
                    if (saveLoader) saveLoader.classList.add('hidden');
                    if (saveText) saveText.textContent = '保存';
                }
            } catch (error) {
                console.error('创建婴儿时发生错误:', error);
                if (msgEl) { msgEl.textContent = '网络错误，请稍后重试'; msgEl.classList.remove('hidden'); msgEl.classList.remove('text-green-500'); msgEl.classList.add('text-red-500'); }
                if (saveBtn) saveBtn.disabled = false;
                if (saveLoader) saveLoader.classList.add('hidden');
                if (saveText) saveText.textContent = '保存';
            }
        });

        // 取消创建婴儿（关闭模态）
        document.getElementById('cancel-create-baby').addEventListener('click', function() {
            hideCreateBabyModal();
        });

        // 编辑婴儿信息：打开模态并尝试预填当前信息
        document.getElementById('edit-baby-btn').addEventListener('click', function() {
            // 尝试读取当前显示的婴儿信息并填入表单
            const name = document.getElementById('baby-name').textContent.trim();
            const genderText = document.getElementById('baby-gender').textContent.trim();
            const birth = document.getElementById('baby-birthdate').textContent.trim();

            showCreateBabyModal();
            // 填充表单（如果有值）
            if (name && name !== '未设置') document.getElementById('baby-name-input').value = name;
            if (genderText === '男') document.getElementById('baby-gender-select').value = 'boy';
            if (genderText === '女') document.getElementById('baby-gender-select').value = 'girl';
            if (birth && birth !== '未设置') document.getElementById('baby-birthdate-data').value = birth;
        });

        // 主按钮点击事件
        document.querySelectorAll('.main-button').forEach(button => {
            button.addEventListener('click', function() {
                const buttonText = this.textContent.trim();
                // 睡眠按钮有特殊行为
                if (button.id === 'sleep-button') {
                    // 调用开始睡眠流程
                    startSleep();
                    return;
                }
                alert(`您点击了: ${buttonText}`);
                // 这里可以根据按钮类型跳转到相应的记录页面
            });
        });

        // 已移除测试计时器按钮事件

        // 开始睡眠：调用后端创建记录并打开计时器模态
        async function startSleep() {
            if (!currentBabyId) {
                alert('未选择婴儿，请先设置宝宝');
                return;
            }
            const token = localStorage.getItem('authToken');
            if (!token) { alert('未登录，请先登录'); return; }

            // client-side time as a fallback; server will return authoritative start_time
            const startTime = new Date().toISOString();
            try {
                const res = await fetch('/api/sleep/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ start_time: startTime, baby_id: currentBabyId })
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.message || '开始睡眠失败');
                    return;
                }
                const data = await res.json();
                // 后端返回了 sleep 对象，优先使用 data.data 或 data
                currentSleepId = (data && data.data && data.data.id) || data.id || null;
                // 打开 3D 计时器
                const serverStartIso = (data && data.data && data.data.start_time) || data.start_time || startTime;
                openTimer3D(serverStartIso);
            } catch (e) {
                console.error('startSleep error', e);
                alert('开始睡眠请求失败');
            }
        }

        // 打开睡眠计时器，接受可选的 serverStartIso (ISO timestamp string)
        // 关闭与停止：按钮与遮罩
        document.addEventListener('click', function(e){
            const backdrop = document.getElementById('timer3d-backdrop');
            if (backdrop && e.target === backdrop){ closeTimer3D(); }
        });
        const stopBtn3d = document.getElementById('timer3d-stop');
        if (stopBtn3d){ stopBtn3d.addEventListener('click', async function(){ await stopSleep(); closeTimer3D(); }); }

        // 结束睡眠
        async function stopSleep() {
            if (!currentSleepId) {
                alert('未找到当前睡眠记录');
                return;
            }
            const token = localStorage.getItem('authToken');
            if (!token) { alert('未登录，请先登录'); return; }
            const endTime = new Date().toISOString();
            try {
                const res = await fetch(`/api/sleep/${currentSleepId}/end`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ end_time: endTime })
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.message || '结束睡眠失败');
                    return;
                }
                const data = await res.json();
                // 停止计时（关闭操作由调用处负责）
                currentSleepId = null;
                // 可选：更新页面统计（这里暂时简单提示）
                alert('睡眠已结束并保存');
            } catch (e) {
                console.error('stopSleep error', e);
                alert('结束睡眠请求失败');
            }
        }

        function msToHMS(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2,'0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,'0');
            const secs = String(totalSeconds % 60).padStart(2,'0');
            return `${hrs}:${mins}:${secs}`;
        }

        // 从后端获取用户信息并存储用户ID
        async function fetchUserInfo() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                console.warn("未找到认证token，无法获取用户信息");
                return;
            }

            try {
                const response = await fetch('/api/user/info', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("用户信息:", data);

                    // 存储用户ID以备后用
                    localStorage.setItem('currentUserId', data.user.id); // 假设后端返回了用户 ID
                } else {
                    console.error("获取用户信息失败，状态码:", response.status);
                }
            } catch (error) {
                console.error("获取用户信息时发生错误:", error);
            }
        }

        // 页面加载时获取用户信息
        //暂时，决定，在login时存储userid
        // document.addEventListener('DOMContentLoaded', async function() {
        //     await fetchUserInfo();
        // });

    </script>
    <script src="/static/js/timer3d.js"></script>
</body>
