<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母乳喂养记录系统</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* specific form layout tweaks remain inline or could be moved to shared css */
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen flex items-center justify-center p-4">
    {% include '_decorative_circles.html' %}

    <div class="w-full max-w-4xl flex flex-col md:flex-row bg-white rounded-2xl shadow-xl overflow-hidden z-10">
        <!-- 左侧欢迎区域 -->
        <div class="md:w-2/5 bg-gradient-to-br from-blue-500 to-purple-600 text-white p-8 flex flex-col justify-center">
            <div class="mb-6">
                <h1 class="text-3xl font-bold">母乳喂养记录系统</h1>
                <p class="mt-2 text-blue-100">记录宝宝成长的每一个珍贵时刻</p>
            </div>
            
            <div class="mt-6 space-y-4">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span>记录喂养时间和时长</span>
                </div>
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span>跟踪宝宝体重变化</span>
                </div>
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center mr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span>生成喂养统计报告</span>
                </div>
            </div>
            
            <div class="mt-8 text-blue-100 text-sm">
                <p>"记录宝宝的每一次喂养，让母爱更有迹可循"</p>
            </div>
        </div>
        
        <!-- 右侧表单区域 -->
        <div class="md:w-3/5 p-8">
            <div class="flex border-b mb-6">
                <button id="login-tab" class="py-2 px-4 font-medium text-gray-800 border-b-2 border-blue-500">登录</button>
                <button id="register-tab" class="py-2 px-4 font-medium text-gray-500">注册</button>
            </div>
            
            <!-- 登录表单 -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="login-username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="login-username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入用户名" required>
                </div>

                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入密码" required>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700">记住我</label>
                    </div>
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-500">忘记密码?</a>
                </div>

                <button aria-label="登录" type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 flex justify-center items-center">
                    <span id="login-text">登录</span>
                    <div id="login-loader" class="loader hidden"></div>
                </button>

                <div id="login-message" class="text-sm text-center mt-2 hidden"></div>
            </form>
            
            <!-- 注册表单 -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label for="register-name" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="register-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入姓名" required>
                </div>
                
                <div>
                    <label for="register-email" class="block text-sm font-medium text-gray-700 mb-1">邮箱地址</label>
                    <input type="email" id="register-email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入邮箱" required>
                </div>
                
                <div>
                    <label for="register-password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="register-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入密码" required minlength="6">
                </div>
                
                <div>
                    <label for="register-confirm-password" class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <input type="password" id="register-confirm-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请再次输入密码" required>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="agree-terms" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" required>
                    <label for="agree-terms" class="ml-2 block text-sm text-gray-700">我同意 <a href="#" class="text-blue-600 hover:text-blue-500">服务条款</a> 和 <a href="#" class="text-blue-600 hover:text-blue-500">隐私政策</a></label>
                </div>
                
                <button aria-label="注册" type="submit" id="register-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 flex justify-center items-center">
                    <span id="register-text">注册</span>
                    <div id="register-loader" class="loader hidden"></div>
                </button>
                
                <div id="register-message" class="text-sm text-center mt-2 hidden"></div>
            </form>
            
            <!-- 第三方登录 -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-center text-sm text-gray-600">或使用以下方式登录</p>
                <div class="mt-4 flex justify-center space-x-4">
                    <button class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition duration-200">
                        <svg class="w-5 h-5 text-gray-700" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                    </button>
                    <button class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition duration-200">
                        <svg class="w-5 h-5 text-gray-700" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.174-.105-.949-.199-2.403.042-3.441.219-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.653 2.567-.992 3.992-.285 1.193.6 2.165 1.775 2.165 2.128 0 3.768-2.245 3.768-5.487 0-2.861-2.063-4.869-5.008-4.869-3.41 0-5.409 2.562-5.409 5.199 0 1.033.394 2.143.889 2.741.099.12.112.225.085.345-.09.375-.293 1.199-.334 1.363-.053.225-.172.271-.402.165-1.495-.69-2.433-2.878-2.433-4.646 0-3.776 2.748-7.252 7.92-7.252 4.158 0 7.392 2.967 7.392 6.923 0 4.135-2.607 7.462-6.233 7.462-1.214 0-2.357-.629-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24.009 12.017 24.009c6.624 0 11.99-5.367 11.99-11.988C24.007 5.367 18.641.001.012.017z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置后端API地址
        const API_BASE_URL = 'http://127.0.0.1:5000/api'; // 请根据您的实际Flask服务地址修改
        console.log("脚本开始执行");
        // 切换登录和注册表单
            document.getElementById('login-tab').addEventListener('click', function() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-tab').classList.add('border-blue-500', 'text-gray-800');
            document.getElementById('login-tab').classList.remove('text-gray-500');
            document.getElementById('register-tab').classList.remove('border-blue-500', 'text-gray-800');
            document.getElementById('register-tab').classList.add('text-gray-500');
        });
        
            document.getElementById('register-tab').addEventListener('click', function() {
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-tab').classList.add('border-blue-500', 'text-gray-800');
            document.getElementById('register-tab').classList.remove('text-gray-500');
            document.getElementById('login-tab').classList.remove('border-blue-500', 'text-gray-800');
            document.getElementById('login-tab').classList.add('text-gray-500');
        });
        
        // 登录表单提交处理
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            // 显示加载状态
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginLoader = document.getElementById('login-loader');
            const loginMessage = document.getElementById('login-message');
            
            loginBtn.disabled = true;
            loginText.textContent = '登录中...';
            loginLoader.classList.remove('hidden');
            loginMessage.classList.add('hidden');
            
        try {
                // 发送登录请求到后端
                console.log("发送登录请求");
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                console.log("获取完成response数据");
                console.log(data.message+"----");
                if (data.message=='登录成功') {
                    // 登录成功，显示成功消息并跳转
                    console.log('开始登录');
                    loginMessage.textContent = '登录成功！正在跳转...';
                    loginMessage.classList.remove('hidden');
                    loginMessage.classList.remove('text-red-500');
                    loginMessage.classList.add('text-green-500');
                    
                    // 保存token到本地存储（如果后端返回了token）
                    if (data.access_token) {
                        console.log('保存token');
                        localStorage.setItem('authToken', data.access_token);
                    }
                    if (data.user)
                    {
                        console.log('保存用户信息');
                        localStorage.setItem('userInfo', JSON.stringify(data.user));
                    }
                    
                    // 延迟一下让用户看到成功消息
                    setTimeout(() => {
                        // 跳转到首页
                        window.location.href = `${API_BASE_URL}/auth/dashboard`; // 请根据您的实际首页路由修改
                    }, 1500);
                } else {
                    // 登录失败，显示错误消息
                    loginMessage.textContent = data.message || '登录失败，请检查您的用户名和密码';
                    loginMessage.classList.remove('hidden');
                    loginMessage.classList.remove('text-green-500');
                    loginMessage.classList.add('text-red-500');
                    
                    // 恢复按钮状态
                    loginBtn.disabled = false;
                    loginText.textContent = '登录';
                    loginLoader.classList.add('hidden');
                }
        } catch (error) {
                console.error('登录请求失败:', error);
                loginMessage.textContent = '网络错误，请稍后重试';
                loginMessage.classList.remove('hidden');
                loginMessage.classList.remove('text-green-500');
                loginMessage.classList.add('text-red-500');
                
                // 恢复按钮状态
                loginBtn.disabled = false;
                loginText.textContent = '登录';
                loginLoader.classList.add('hidden');
            }
        });
        
        // 注册表单提交处理
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            // 验证密码是否匹配
            if (password !== confirmPassword) {
                const registerMessage = document.getElementById('register-message');
                registerMessage.textContent = '两次输入的密码不一致';
                registerMessage.classList.remove('hidden');
                registerMessage.classList.remove('text-green-500');
                registerMessage.classList.add('text-red-500');
                return;
            }
            
            // 显示加载状态
            const registerBtn = document.getElementById('register-btn');
            const registerText = document.getElementById('register-text');
            const registerLoader = document.getElementById('register-loader');
            const registerMessage = document.getElementById('register-message');
            
            registerBtn.disabled = true;
            registerText.textContent = '注册中...';
            registerLoader.classList.remove('hidden');
            registerMessage.classList.add('hidden');
            
            try {
                // 发送注册请求到后端
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: name,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // 注册成功
                    registerMessage.textContent = '注册成功！请登录';
                    registerMessage.classList.remove('hidden');
                    registerMessage.classList.remove('text-red-500');
                    registerMessage.classList.add('text-green-500');
                    
                    // 延迟一下然后切换到登录表单
                    setTimeout(() => {
                        document.getElementById('login-tab').click();
                        document.getElementById('login-email').value = email;
                    }, 1500);
                } else {
                    // 注册失败
                    registerMessage.textContent = data.message || '注册失败，请稍后重试';
                    registerMessage.classList.remove('hidden');
                    registerMessage.classList.remove('text-green-500');
                    registerMessage.classList.add('text-red-500');
                    
                    // 恢复按钮状态
                    registerBtn.disabled = false;
                    registerText.textContent = '注册';
                    registerLoader.classList.add('hidden');
                }
            } catch (error) {
                console.error('注册请求失败:', error);
                registerMessage.textContent = '网络错误，请稍后重试';
                registerMessage.classList.remove('hidden');
                registerMessage.classList.remove('text-green-500');
                registerMessage.classList.add('text-red-500');
                
                // 恢复按钮状态
                registerBtn.disabled = false;
                registerText.textContent = '注册';
                registerLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
